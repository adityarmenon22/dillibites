<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}DilliBites{% endblock %} · DilliBites</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <div class="logo">Dilli<span>Bites</span></div>
  <nav>
    {% for ep, label in nav %}
      <a href="{{ url_for(ep) }}" class="{{ 'on' if request.endpoint == ep or (ep=='orders' and request.endpoint=='order_detail') or (ep=='restaurants' and request.endpoint=='restaurant') else '' }}">{{ label }}</a>
    {% endfor %}
  </nav>
</header>
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block body %}{% endblock %}
</main>
<footer>DilliBites · DBMS project · MySQL 8 + Flask</footer>
</body>
</html>
